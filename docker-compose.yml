services:
  frontend:
    image: nginx:1.27-alpine
    ports:
      - "${PORT_FRONTEND:-3000}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - predictor-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

  go-backend:
    build:
      context: ./go-backend
      dockerfile: Dockerfile
    ports:
      - "${PORT_BACKEND:-8080}:8080"
    environment:
      - PORT=${PORT_BACKEND:-8080}
      - HTTP_PORT=${PORT_BACKEND:-8080}
      - BINANCE_WS_URL=${BINANCE_WS_URL}
      - BINANCE_REST_URL=${BINANCE_REST_URL:-https://api.binance.com}
      - ML_SERVICE_URL=http://ml-service:8000
      - FRONTEND_DIR=/app/frontend
    networks:
      - predictor-net
    restart: unless-stopped
    depends_on:
      ml-service:
        condition: service_started

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "${PORT_ML:-8000}:8000"
    environment:
      - PORT=${PORT_ML:-8000}
    networks:
      - predictor-net
    restart: unless-stopped

networks:
  predictor-net:
    driver: bridge
