<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTCUSDT Predictor</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://unpkg.com/lightweight-charts@5.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <div id="header">
        <h1>BTCUSDT</h1>
        <span id="timeframe">1s</span>
    </div>
    <div id="chart-container"></div>
    <div id="loader-overlay">
        <div class="loader-spinner"></div>
        <span class="loader-text">Connecting...</span>
    </div>
    <div id="status-bar" class="status-connecting">
        <span id="status-text">Connecting...</span>
    </div>
    <script src="/js/chart.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
